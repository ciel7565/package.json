; 전통발효체험관 메타버스 — per-directory PHP limits (CONTRACT §15.7 #14).
; PHP-FPM / mod_php read a .user.ini in the serving directory. These bound the request body an upload can carry;
; the application also enforces its own, smaller per-field size caps (journal photo ≤ 5 MB) and re-encodes images.
; (expose_php is PHP_INI_SYSTEM and cannot be set here — set it in php.ini and/or ServerTokens Prod in httpd.conf.)
upload_max_filesize = 6M
post_max_size = 8M
max_file_uploads = 2
file_uploads = On
