<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--@CSP-->
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1a14">
<meta name="description" content="전통발효체험관 메타버스 — 한국 전통발효문화와 농업체험을 3D로 탐험하고 배우는 브라우저 교육형 메타버스 게임">
<title>전통발효체험관 메타버스</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='14' rx='14' ry='5' fill='%233b2416'/%3E%3Cpath d='M14 18c-6 8-6 30 4 38h28c10-8 10-30 4-38z' fill='%235a3520'/%3E%3Cpath d='M18 26h28' stroke='%23f4c54a' stroke-width='3'/%3E%3C/svg%3E">
<!--@FONTFACE-->
<style>
/*@CSS*/
</style>
</head>
<body>
<div id="app">
  <!-- Three.js renders into this container (canvas is appended by the engine) -->
  <main id="game-container" aria-label="3D 게임 화면"></main>
  <!-- World-anchored DOM labels (name tags, plot stats, emote bubbles) -->
  <div id="labels-layer" aria-hidden="true"></div>

  <!-- ============================== HUD ============================== -->
  <div id="hud" class="hud" hidden>
    <header id="hud-profile" class="glass hud-profile">
      <button class="hud-avatar" data-action="avatar" title="아바타 꾸미기" aria-label="아바타 꾸미기"><span class="ico" data-icon="user"></span></button>
      <div class="hud-brand">
        <div class="hud-brand-top">METAVERSE</div>
        <div class="hud-brand-title">전통발효체험관</div>
        <div class="hud-online"><span class="dot"></span>온라인 <b id="hud-online-count">1</b>명</div>
      </div>
    </header>

    <section id="hud-player" class="glass hud-player" aria-label="플레이어 정보">
      <div class="hud-player-row">
        <span id="hud-level" class="lv-chip">Lv.1</span>
        <span id="hud-nickname" class="hud-nick">게스트</span>
        <span id="hud-title" class="title-chip" hidden></span>
      </div>
      <div class="bar bar-exp" title="경험치"><i id="hud-exp-bar" style="width:0%"></i><span id="hud-exp-text"></span></div>
      <div class="hud-player-row hud-currency">
        <span class="cur-coin" title="코인"><span class="ico ico-sm" data-icon="coin"></span><b id="hud-coin">0</b></span>
        <span class="cur-edu" title="교육 포인트"><span class="ico ico-sm" data-icon="book"></span><b id="hud-edu">0</b></span>
        <span id="hud-mode" class="mode-chip" title="저장 방식">로컬</span>
      </div>
    </section>

    <nav id="hud-left-menu" class="glass hud-left-menu" aria-label="메인 메뉴">
      <button data-action="avatar" class="easy-hide"><span class="ico" data-icon="user"></span><span class="lbl">아바타</span></button>
      <button data-action="chat" class="easy-hide"><span class="ico" data-icon="chat"></span><span class="lbl">채팅</span></button>
      <button data-action="move" class="easy-hide"><span class="ico" data-icon="pin"></span><span class="lbl">이동</span></button>
      <button data-action="minimap" class="easy-hide"><span class="ico" data-icon="map"></span><span class="lbl">미니맵</span></button>
      <span class="menu-sep easy-hide" role="separator"></span>
      <button data-action="inventory" class="lm-tile" data-say="가방. 모은 물건을 봐요."><span class="ico" data-icon="bag"></span><span class="lm-emo emoji easy-only" aria-hidden="true">🎒</span><span class="lbl">가방</span></button>
      <button data-action="quests" class="easy-hide"><span class="ico" data-icon="quest"></span><span class="lbl">퀘스트</span></button>
      <button data-action="collection" class="easy-hide"><span class="ico" data-icon="collection"></span><span class="lbl">도감</span></button>
      <button data-action="stickerbook" class="lm-tile easy-only" data-say="스티커북. 모은 스티커를 봐요." aria-label="스티커북"><span class="lm-emo emoji" aria-hidden="true">📖</span><span class="lbl">스티커북</span></button>
      <button data-action="today" class="lm-tile easy-only" data-say="오늘. 출석 도장과 오늘의 놀이를 봐요." aria-label="오늘의 놀이"><span class="lm-emo emoji" aria-hidden="true">🔔</span><span class="lbl">오늘</span></button>
      <button data-action="menu" class="lm-tile" data-say="메뉴"><span class="ico" data-icon="menu"></span><span class="lm-emo emoji easy-only" aria-hidden="true">☰</span><span class="lbl">메뉴</span></button>
    </nav>

    <aside id="hud-right" class="hud-right">
      <section id="minimap-panel" class="glass panel minimap-panel" aria-label="미니맵">
        <header class="panel-head">
          <h2>미니맵</h2>
          <div class="panel-tools">
            <button class="icon-btn" data-action="minimap-collapse" title="접기" aria-label="미니맵 접기"><span class="ico ico-sm" data-icon="minus"></span></button>
            <button class="icon-btn" data-action="minimap-close" title="닫기" aria-label="미니맵 닫기"><span class="ico ico-sm" data-icon="x"></span></button>
          </div>
        </header>
        <div class="minimap-wrap">
          <canvas id="minimap-canvas" width="272" height="196"></canvas>
          <div class="minimap-zoom">
            <button class="icon-btn" data-action="minimap-zoom-in" aria-label="확대"><span class="ico ico-sm" data-icon="plus"></span></button>
            <button class="icon-btn" data-action="minimap-zoom-out" aria-label="축소"><span class="ico ico-sm" data-icon="minus"></span></button>
          </div>
        </div>
        <div id="minimap-address" class="minimap-address"></div>
      </section>
      <button id="easy-where" type="button" class="easy-only easy-where-btn" data-action="where" data-say="어디 갈까? 가고 싶은 곳을 골라요."><span class="emoji" aria-hidden="true">🗺️</span><span class="lbl">어디 갈까?</span></button>

      <section id="quest-panel" class="glass panel quest-panel" aria-label="퀘스트">
        <header class="panel-head">
          <h2>퀘스트</h2>
          <div class="panel-tools">
            <button class="icon-btn" data-action="quest-collapse" title="접기" aria-label="퀘스트 접기"><span class="ico ico-sm" data-icon="minus"></span></button>
          </div>
        </header>
        <div id="quest-list" class="quest-list"></div>
        <button class="btn btn-block btn-soft" data-action="quests">퀘스트 모두 보기 <span class="ico ico-sm" data-icon="chevron-right"></span></button>
      </section>
    </aside>

    <div id="hud-top-center" class="hud-top-center">
      <section id="easy-next" class="glass easy-next easy-only" aria-label="다음 할 일" aria-live="polite" hidden>
        <span class="en-emoji emoji" aria-hidden="true">🗺️</span>
        <div class="en-main">
          <div class="en-label">다음 할 일</div>
          <div class="en-text">구경해요</div>
          <div class="en-pips" hidden></div>
        </div>
        <div class="en-btns">
          <button type="button" class="en-go" data-action="easy-go" hidden><span class="emoji" aria-hidden="true">👉</span><span class="en-go-lbl">같이 가기</span></button>
          <button type="button" class="en-say easy-speak" data-action="easy-read" aria-label="소리로 듣기" title="소리로 듣기"><span class="emoji" aria-hidden="true">🔊</span></button>
        </div>
      </section>
      <div id="notice-banner" class="glass notice-banner" hidden></div>
      <div id="objective-hint" class="glass objective-hint" hidden></div>
    </div>
    <div id="zone-label" class="zone-label" hidden><small>현재 위치</small><b></b></div>

    <section id="chat-panel" class="glass chat-panel" aria-label="채팅">
      <header class="chat-tabs" role="tablist">
        <button data-channel="all" class="active" role="tab">전체</button>
        <button data-channel="local" role="tab">지역</button>
        <button data-channel="system" role="tab">시스템</button>
        <button class="icon-btn chat-collapse" data-action="chat-collapse" title="채팅 접기" aria-label="채팅 접기"><span class="ico ico-sm" data-icon="minus"></span></button>
      </header>
      <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" maxlength="120" placeholder="메시지를 입력하세요..." aria-label="채팅 메시지">
        <button type="submit" class="btn btn-primary btn-sm">전송</button>
      </form>
    </section>

    <nav id="bottom-bar" class="glass bottom-bar" aria-label="빠른 메뉴">
      <button data-action="express" class="easy-only" data-say="표현하기. 기분과 몸짓을 보여 줘요." aria-label="표현하기"><span class="bb-emo emoji" aria-hidden="true">😊</span><span class="lbl">표현하기</span></button>
      <button data-action="emote" class="easy-hide"><span class="ico" data-icon="smile"></span><span class="lbl">이모지</span></button>
      <button data-action="gesture" class="easy-hide"><span class="ico" data-icon="hand"></span><span class="lbl">제스처</span></button>
      <button data-action="journal" data-say="일기. 오늘 한 일을 그림으로 남겨요."><span class="ico" data-icon="journal"></span><span class="bb-emo emoji easy-only" aria-hidden="true">📝</span><span class="lbl easy-hide">작업일지</span><span class="lbl easy-only">일기</span></button>
      <button data-action="weather" class="weather-btn easy-hide"><span class="weather-now"><span id="weather-icon" class="ico" data-icon="sun"></span><b id="weather-temp">23°C</b><span class="ico ico-xs" data-icon="chevron-down"></span></span><span class="lbl">날씨</span></button>
      <button data-action="photo" data-say="사진. 사진을 찍어요."><span class="ico" data-icon="camera"></span><span class="bb-emo emoji easy-only" aria-hidden="true">📸</span><span class="lbl">사진</span></button>
      <button data-action="voice" class="easy-hide"><span class="ico" data-icon="mic"></span><span class="lbl">음성</span></button>
      <button data-action="sound" id="easy-sound-btn" class="easy-only" aria-pressed="true" aria-label="소리 끄기" data-say="소리. 소리를 켜고 꺼요."><span class="bb-emo emoji" aria-hidden="true">🔊</span><span class="lbl">소리</span></button>
    </nav>
    <button id="easy-chat-btn" type="button" class="glass easy-only easy-chat-btn" data-action="kid-chat" data-badge-host aria-label="이야기하기" data-say="이야기. 친구에게 인사말을 보내요."><span class="emoji" aria-hidden="true">💬</span><span class="lbl">이야기</span></button>
    <div id="popover-root"></div>

    <div id="dpad" class="dpad" aria-label="이동 패드">
      <button data-dir="up" aria-label="앞으로"><span class="ico" data-icon="chevron-up"></span></button>
      <button data-dir="left" aria-label="왼쪽"><span class="ico" data-icon="chevron-left"></span></button>
      <button data-dir="center" aria-label="상호작용"><span class="dpad-center"></span></button>
      <button data-dir="right" aria-label="오른쪽"><span class="ico" data-icon="chevron-right"></span></button>
      <button data-dir="down" aria-label="뒤로"><span class="ico" data-icon="chevron-down"></span></button>
    </div>

    <div id="mobile-controls" class="mobile-controls" aria-hidden="true">
      <div id="joystick" class="joystick"><div class="joystick-knob"></div></div>
      <div class="mobile-buttons">
        <button data-mobile="interact" class="mb-interact" aria-label="상호작용"><span class="easy-hide">E</span><span class="easy-only emoji" aria-hidden="true">👆</span></button>
        <button data-mobile="jump" class="mb-jump"><span class="ico" data-icon="chevron-up"></span><small>점프</small></button>
        <button data-mobile="run" class="mb-run"><span class="ico" data-icon="run"></span><small>달리기</small></button>
        <button data-mobile="photo" class="mb-photo"><span class="ico" data-icon="camera"></span></button>
      </div>
    </div>

    <div id="interact-prompt" class="interact-prompt" hidden><kbd>E</kbd><span class="interact-text"></span></div>
    <div id="fps-meter" class="fps-meter" hidden></div>
  </div>

  <div id="dialogue-root"></div>
  <div id="photo-ui" class="photo-ui" hidden></div>
  <div id="screen-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="reward-root"></div>
  <div id="fade" class="fade"></div>

  <!-- ============================== LOADING ============================== -->
  <!-- motion graphic: layered 정선 ridges drift behind an onggi jar whose glaze fills with the progress (--p),
       steam curls from the lid, tips cross-fade (04-ui G.ui.loading, 01-hud.css). Static and calm with reduce motion. -->
  <section id="loading-screen" class="loading-screen" aria-live="polite">
    <div class="loading-bg" aria-hidden="true">
      <i class="lb-sun"></i>
      <svg class="lb-ridge r1" viewBox="0 0 1200 400" preserveAspectRatio="none" focusable="false"><path d="M0 230C80 190 140 170 210 200S330 140 420 170S560 120 640 160S780 110 880 150S1040 120 1110 160S1180 170 1200 165V400H0Z"/></svg>
      <svg class="lb-ridge r2" viewBox="0 0 1200 400" preserveAspectRatio="none" focusable="false"><path d="M0 280C90 240 170 250 250 235S380 200 470 230S610 190 700 225S860 200 950 230S1100 210 1200 240V400H0Z"/></svg>
      <i class="lb-mist"></i>
      <svg class="lb-ridge r3" viewBox="0 0 1200 400" preserveAspectRatio="none" focusable="false"><path d="M0 330C120 300 210 315 300 300S470 280 560 305S720 285 820 300S1010 290 1200 310V400H0Z"/></svg>
    </div>
    <div class="loading-inner">
      <div class="loading-jar" aria-hidden="true">
        <svg viewBox="0 0 160 172" width="150" height="161" focusable="false">
          <defs>
            <linearGradient id="ldj-shell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22140c"/><stop offset=".42" stop-color="#4a2c1b"/><stop offset="1" stop-color="#1c100a"/></linearGradient>
            <linearGradient id="ldj-jang" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e2a35a"/><stop offset=".08" stop-color="#a8642f"/><stop offset=".45" stop-color="#7a4321"/><stop offset="1" stop-color="#4a2512"/></linearGradient>
            <linearGradient id="ldj-lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4129"/><stop offset="1" stop-color="#2e1b10"/></linearGradient>
            <clipPath id="ldj-clip"><path d="M55 48C34 56 23 73 25 93C27 119 38 145 56 154L104 154C122 145 133 119 135 93C137 73 126 56 105 48Z"/></clipPath>
          </defs>
          <g class="lj-steam" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
            <path class="s1" d="M64 30c-6-6 6-10 0-16s6-10 0-16"/>
            <path class="s2" d="M80 28c-6-6 6-10 0-16s6-10 0-16"/>
            <path class="s3" d="M96 30c-6-6 6-10 0-16s6-10 0-16"/>
          </g>
          <path class="lj-shell" d="M52 45C30 53 18 71 20 93C22 121 34 149 54 159L106 159C126 149 138 121 140 93C142 71 130 53 108 45Z" fill="url(#ldj-shell)"/>
          <g clip-path="url(#ldj-clip)">
            <g class="lj-fill">
              <path class="lj-wave" fill="url(#ldj-jang)" d="M-160 6 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 V200 H-160 Z"/>
              <circle class="lj-bub b1" cx="62" cy="60" r="3"/><circle class="lj-bub b2" cx="92" cy="74" r="2.4"/><circle class="lj-bub b3" cx="78" cy="88" r="2"/>
            </g>
          </g>
          <path d="M30 112C58 120 102 120 130 112M36 132C60 139 100 139 124 132" stroke="#000" stroke-opacity=".18" stroke-width="2" fill="none"/>
          <path class="lj-band" d="M24 80C52 89 108 89 136 80" stroke="#f4c54a" stroke-width="3.2" stroke-linecap="round" fill="none"/>
          <path d="M40 66C30 84 31 112 42 132" stroke="#fff" stroke-opacity=".16" stroke-width="7" stroke-linecap="round" fill="none"/>
          <ellipse cx="80" cy="45" rx="31" ry="7" fill="#1a0e08"/>
          <g class="lj-lid"><path d="M44 43C48 28 112 28 116 43Z" fill="url(#ldj-lid)"/><ellipse cx="80" cy="43" rx="36" ry="5" fill="#3b2416"/><ellipse cx="80" cy="29" rx="7" ry="3.4" fill="#2a1810"/></g>
        </svg>
        <span class="lj-shadow"></span>
      </div>
      <div class="loading-eyebrow">METAVERSE</div>
      <h1 class="loading-title">전통발효체험관</h1>
      <p class="loading-place"><span class="emoji" aria-hidden="true">🏔️</span>정선 만장대에서 출발해요</p>
      <div class="loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="불러오는 중"><i id="loading-bar-fill"></i></div>
      <div class="loading-status"><span id="loading-label">로딩 중...</span><b id="loading-pct">0%</b></div>
      <p id="loading-tip" class="loading-tip"></p>
    </div>
  </section>

  <div id="fatal" class="fatal" hidden></div>
  <noscript><div class="fatal">이 게임을 실행하려면 JavaScript를 켜 주세요.</div></noscript>
</div>
<script>
/*@VENDOR*/
</script>
<script>
/*@GAME*/
</script>
</body>
</html>
